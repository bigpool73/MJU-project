<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 사용 내역서</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header class="app-header no-print">
  <a class="brand" href="./"><img class="brand-logo" src="assets/mju-logo.png" alt="명지대학교" width="185" height="48"></a>
  <div class="head-row">
    <div>
      <h1>AI 사용 내역서</h1>
      <p>AI와 나눈 대화를 PDF로 올리면, 과제에 AI가 얼마나 반영됐는지 정리해 제출용 내역서를 만들어 드립니다.</p>
    </div>
    <div class="actions">
      <button id="btnDemo" class="ghost" type="button">예시 데이터 불러오기</button>
      <button id="btnReset" class="ghost" type="button">처음부터 다시</button>
    </div>
  </div>
</header>

<div id="confirmBar" class="confirm-bar no-print"></div>

<nav class="tabs no-print" role="tablist" aria-label="화면 선택">
  <button role="tab" id="tabbtn-student" data-tab="student" aria-selected="true" aria-controls="view-student">학생용</button>
  <button role="tab" id="tabbtn-prof" data-tab="prof" aria-selected="false" aria-controls="view-prof" tabindex="-1">교수용 확인</button>
</nav>

<main>
  <section id="view-student" role="tabpanel" aria-labelledby="tabbtn-student">
    <nav id="stepper" class="no-print" aria-label="진행 단계"></nav>
    <div id="stage" class="panel"></div>
  </section>
  <section id="view-prof" role="tabpanel" aria-labelledby="tabbtn-prof" hidden>
    <div id="profStage" class="panel"></div>
  </section>
</main>

<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<footer class="no-print">
  <strong>이 도구가 알려 주는 것과 알려 주지 못하는 것.</strong>
  이 도구는 과제 본문과 AI 답변이 글자·단어로 얼마나 겹치는지를 추정할 뿐이며, 표절이나 부정행위를 판정하지 않습니다.
  AI 답변을 읽고 자기 말로 다시 쓴 내용은 구분하지 못하고, 대화 PDF는 학생이 제출한 파일이라 원본인지 이 도구가 검증하지 못합니다.
  올린 파일은 이 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.
</footer>

<script src="assets/vendor/pdfjs/pdf.min.js"></script>
<script src="src/core.js"></script>
<script src="src/parse.js"></script>
<script src="src/pdf.js"></script>
<script src="src/docs.js"></script>
<script>Pdf.configure({ workerSrc: 'assets/vendor/pdfjs/pdf.worker.min.js' });</script>
<script src="src/analyze.js"></script>
<script src="src/sample.js"></script>
<script src="src/app.js"></script>
</body>
</html>
